<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VanGo | Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <div class="app-shell">

        <!-- Header -->
        <header class="mobile-header">
            <p class="mobile-header-label mb-1 ms-2">Admin</p>
            <h1 class="mobile-header-title mb-0 ms-2">Dashboard</h1>
        </header>

        <!-- Main content -->
        <main class="main main-top flex-grow-1">
            <div class="content-wide mx-auto d-flex flex-column gap-4">

                <!-- Van list -->
                <div class="van-list">

                    <div class="van-row d-flex justify-content-between align-items-center">
                        <div>
                            <p class="van-plate mb-1">ABC 1234</p>
                            <p class="text-muted-custom mb-0">Lipa</p>
                        </div>
                        <span class="pill pill-in">IN</span>
                    </div>

                    <div class="van-row d-flex justify-content-between align-items-center">
                        <div>
                            <p class="van-plate mb-1">XYZ 5678</p>
                            <p class="text-muted-custom mb-0">San Pablo</p>
                        </div>
                        <span class="pill pill-out">OUT</span>
                    </div>

                    <div class="van-row d-flex justify-content-between align-items-center">
                        <div>
                            <p class="van-plate mb-1">DEF 9012</p>
                            <p class="text-muted-custom mb-0">Lipa</p>
                        </div>
                        <span class="pill pill-arrived">Arrived</span>
                    </div>

                    <div class="van-row d-flex justify-content-between align-items-center">
                        <div>
                            <p class="van-plate mb-1">GHI 3456</p>
                            <p class="text-muted-custom mb-0">San Pablo</p>
                        </div>
                        <span class="pill pill-in">IN</span>
                    </div>

                    <div class="van-row d-flex justify-content-between align-items-center">
                        <div>
                            <p class="van-plate mb-1">JKL 7890</p>
                            <p class="text-muted-custom mb-0">Lipa</p>
                        </div>
                        <span class="pill pill-out">OUT</span>
                    </div>

                </div>

                <p class="text-muted-custom mb-0">Scroll for more vans.</p>

                <a href="menu.html" class="btn btn-vango-primary w-100">Menu</a>

            </div>
        </main>

    </div>

</body>
</html>
