<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VanGo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <div class="app-shell">

        <!-- Sidebar (desktop only, hidden by style.css below 1281px) -->
        <aside class="sidebar flex-shrink-0 p-4">
            <a href="index.html" class="sidebar-brand text-white text-decoration-none">VanGo</a>
            <nav>
                <ul class="nav flex-column mt-4">
                    <li class="nav-item"><span class="nav-link px-0">Passenger</span></li>
                    <li class="nav-item"><span class="nav-link px-0">Admin</span></li>
                    <li class="nav-item"><span class="nav-link px-0">Driver / Operator</span></li>
                </ul>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="main flex-grow-1 d-flex flex-column align-items-center">
            <div class="content w-100 d-flex flex-column align-items-center gap-4">

                <img src="images/vango-logo.png" alt="VanGo logo" class="logo img-fluid">

                <p class="text-muted-custom fs-5 mb-0">Central Mall Olivarez</p>

                <a href="vans.html" class="btn btn-vango-primary w-100">View the Vans</a>

                <p class="text-muted-custom mb-0">No login needed for passengers</p>

                <a href="driver.html" class="btn btn-vango-outline w-100">Driver/ Operator</a>
                <a href="admin.html" class="btn btn-vango-outline w-100">Admin</a>

            </div>
        </main>

    </div>

</body>
</html>
