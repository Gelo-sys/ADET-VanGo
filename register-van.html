<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VanGo | New Van</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <div class="app-shell">

        <!-- Header -->
        <header class="mobile-header">
            <p class="mobile-header-label mb-1 ms-2">Admin</p>
            <h1 class="mobile-header-title mb-0 ms-2">New Van</h1>
        </header>

        <!-- Main content -->
        <main class="main main-top flex-grow-1">
            <div class="content-wide mx-auto d-flex flex-column gap-4">

                <!-- Form card -->
                <div class="form-card">

                    <div>
                        <label for="plate-number" class="field-label">Plate number</label>
                        <input type="text" id="plate-number" class="form-control input-vango" placeholder="ABC 1234">
                    </div>

                    <div>
                        <label for="dedicated-driver-operator" class="field-label">Dedicated Driver/Operator</label>
                        <input type="text" id="dedicated-driver-operator" class="form-control input-vango" placeholder="Select an account">
                    </div>

                </div>

                <p class="text-muted-custom mb-0">The plate number is used in the logbook.</p>

                <a href="menu.html" class="btn btn-vango-primary w-100">Save van</a>

            </div>
        </main>

    </div>

</body>
</html>
